apiVersion: v1
kind: Service
metadata:
  name: taskboard-db
  labels:
    app.kubernetes.io/name: taskboard
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskboard
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-app
  labels:
    app.kubernetes.io/name: taskboard
    app.kubernetes.io/component: app
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: taskboard
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 80
      targetPort: http

