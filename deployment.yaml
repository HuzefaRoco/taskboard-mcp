# Create the required Secret separately so credentials are not committed:
#   kubectl create secret generic taskboard-secrets \
#     --from-literal=postgres-password='<url-safe-password>' \
#     --from-literal=database-url='postgresql+psycopg://taskboard:<url-safe-password>@taskboard-db:5432/taskboard' \
#     --from-literal=session-secret='<random-session-secret>'
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taskboard-db-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-db
  labels:
    app.kubernetes.io/name: taskboard
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: taskboard
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskboard
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: taskboard
            - name: POSTGRES_DB
              value: taskboard
            # Keep PGDATA off the volume mount root: the GKE PD root holds
            # lost+found, and initdb refuses to initialize a non-empty dir.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskboard-secrets
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: taskboard-db-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-app
  labels:
    app.kubernetes.io/name: taskboard
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: taskboard
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskboard
        app.kubernetes.io/component: app
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h taskboard-db -p 5432 -U taskboard -d taskboard; do sleep 2; done
      containers:
        - name: app
          image: sultanhaseeb/taskboard.mcp:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskboard-secrets
                  key: database-url
            # Change this to the public HTTPS origin used to reach the service.
            - name: PUBLIC_BASE_URL
              value: https://mcp.rocotal.com
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskboard-secrets
                  key: session-secret
            - name: ACCESS_TOKEN_TTL_SECONDS
              value: "3600"
            - name: REFRESH_TOKEN_TTL_SECONDS
              value: "2592000"
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        # The Dockerfile creates taskboard as the first regular Linux user.
        runAsUser: 1000
